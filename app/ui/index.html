<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#eee8d5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Workflow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Workflow</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var t = localStorage.getItem('workflow-theme');
      if (t === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#00212b';
      }
      // Apple platforms: prefer native SF Mono via ui-monospace (it can't be
      // self-hosted). Everywhere else keeps the CSS default (JetBrains Mono).
      if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '')) {
        document.documentElement.style.setProperty('--font-mono', "ui-monospace, 'SF Mono', monospace");
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
