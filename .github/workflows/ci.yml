name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Narrow by design: Linux only, and the Playwright e2e suite (app/ui/tests) is not
# run here. Every step below is a command the README tells contributors to run.
jobs:
  ci:
    name: cli + server + ui
    runs-on: ubuntu-latest
    env:
      # whatsapp-web.js pulls puppeteer, which downloads Chromium on postinstall.
      # No step in this job drives a browser.
      PUPPETEER_SKIP_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: cli typecheck
        working-directory: cli
        run: npm run typecheck

      - name: cli build
        working-directory: cli
        run: npm run build

      - name: cli tests
        working-directory: cli
        run: npm run test

      - name: app/server tests
        working-directory: app/server
        run: npm test

      - name: app/ui typecheck
        working-directory: app/ui
        run: npx tsc -b

      - name: app/ui lint
        working-directory: app/ui
        run: npm run lint

      - name: app/ui build
        working-directory: app/ui
        run: npm run build
